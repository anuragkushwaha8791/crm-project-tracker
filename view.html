<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project View (Shared) - Mooving CRM</title>

<style>
:root{
  --bg:#f8fafc;
  --card-bg:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --navy:#1f4e79;
  --danger:#dc2626;
  --badge-pending-bg:#fef3c7;
  --badge-pending-txt:#92400e;
  --badge-progress-bg:#dbeafe;
  --badge-progress-txt:#1e40af;
  --badge-complete-bg:#dcfce7;
  --badge-complete-txt:#166534;
}

[data-theme="dark"]{
  --bg:#0f172a;
  --card-bg:#1e293b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#334155;
  --navy:#38bdf8;
  --badge-pending-bg:#451a03;
  --badge-pending-txt:#fde68a;
  --badge-progress-bg:#172554;
  --badge-progress-txt:#bfdbfe;
  --badge-complete-bg:#052e16;
  --badge-complete-txt:#86efac;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  margin:0;
  padding:24px;
}

h1{
  color:var(--navy);
  font-size:24px;
  font-weight:800;
  margin-bottom:16px;
}

.badge{
  display:inline-block;
  background:#dbeafe;
  color:#1e40af;
  padding:6px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-bottom:20px;
}

.card{
  background:var(--card-bg);
  padding:28px;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.04);
  border:1px solid var(--border);
  max-width:640px;
}

.row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  padding:10px 0;
  font-size:14px;
}

.row .label{
  color:var(--muted);
  font-weight:600;
}

.row .value{
  font-weight:700;
  color:var(--navy);
  text-align:right;
}

.table-wrapper{
  overflow-x:auto;
  border-radius:10px;
  border:1px solid var(--border);
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--card-bg);
  white-space:nowrap;
}

th, td{
  border-bottom:1px solid var(--border);
  padding:10px 12px;
  font-size:12px;
  text-align:left;
}

th{
  background:var(--navy);
  color:white;
  font-weight:700;
  text-transform:uppercase;
}

tr.overdue{
  background:#fef2f2;
}

.search-section{
  margin-bottom:16px;
}

.search-section input{
  width:100%;
  max-width:400px;
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card-bg);
  color:var(--text);
  outline:none;
}

.badge-status{
  display:inline-block;
  padding:3px 8px;
  border-radius:10px;
  font-weight:700;
  font-size:11px;
}
.badge-pending{ background:var(--badge-pending-bg); color:var(--badge-pending-txt); }
.badge-progress{ background:var(--badge-progress-bg); color:var(--badge-progress-txt); }
.badge-complete{ background:var(--badge-complete-bg); color:var(--badge-complete-txt); }

.note{
  font-size:12px;
  color:var(--muted);
  margin-top:12px;
}

#msg{
  color:var(--danger);
  font-weight:600;
}

</style>
</head>

<body>

<div class="badge">👁 Read-only shared view</div>

<div id="content">Loading...</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
collection,
query,
orderBy,
limit,
getDocs,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCSa-bvwEaFSz2MKt6AFFUe5QvbSy-7br4",
authDomain: "anurag-kushwaha-projects.firebaseapp.com",
projectId: "anurag-kushwaha-projects",
storageBucket: "anurag-kushwaha-projects.firebasestorage.app",
messagingSenderId: "745347735405",
appId: "1:745347735405:web:7a486753dba3bd499c0464"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const VIEW_LIMIT = 300;

function escapeHtml(value){
if(value === undefined || value === null) return "";
return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}

function parseLocalDate(dateStr){
if(!dateStr) return null;
const parts = dateStr.split("-");
if(parts.length !== 3) return null;
return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
}

function ageing(d){
const start = parseLocalDate(d.taskStartDate);
const end = parseLocalDate(d.taskEndDate);
if(!start || !end) return "-";
const diff = Math.round((end - start)/86400000);
return (diff >= 0 ? diff : 0) + " Days";
}

function isOverdue(d){
if(!d.taskEndDate || d.taskStatus === "Complete") return false;
const today = new Date(); today.setHours(0,0,0,0);
const end = parseLocalDate(d.taskEndDate);
return end ? end < today : false;
}

async function renderSingle(id){
const contentEl = document.getElementById("content");
if(!contentEl) return;

try{
const snap = await getDoc(doc(db,"crmprojects",id));

if(!snap.exists()){
contentEl.innerHTML = "<h1>Project Not Found</h1><p id='msg'>This link may be invalid or the project was deleted.</p>";
return;
}

const d = snap.data();

const fields = [
["Project Name", d.projectName],
["Type Of Business", d.business],
["Type Of Asset", d.assetType],
["Project Owner", d.ownerName || d.projectOwner],
["Asset Model", d.assetModel],
["Running Task", d.runningTask],
["Project SPOC", d.projectSpoc],
["Start Date", d.taskStartDate],
["End Date", d.taskEndDate],
["Status", d.taskStatus],
["Priority", d.taskPriority],
["Progress 1", d.progress1],
["Progress 2", d.progress2],
["Remarks", d.remarks],
["Ageing", ageing(d)]
];

let rows = fields.map(([label,value])=>`
<div class="row">
<span class="label">${escapeHtml(label)}</span>
<span class="value">${escapeHtml(value) || "-"}</span>
</div>
`).join("");

contentEl.innerHTML = `
<h1>${escapeHtml(d.projectName) || "Project"}</h1>
<div class="card">${rows}</div>
`;

}catch(error){
console.error(error);
contentEl.innerHTML = "<h1>Unable to load project</h1><p id='msg'>Check your connection or permissions.</p>";
}
}

async function renderAll(){
const contentEl = document.getElementById("content");
if(!contentEl) return;

try{
const q = query(collection(db,"crmprojects"), orderBy("createdAt","desc"), limit(VIEW_LIMIT));
const snapshot = await getDocs(q);

let allProjects = [];
snapshot.forEach(docSnap=>allProjects.push(docSnap.data()));

let html = `
<h1>All Projects</h1>
<div class="search-section">
<input id="searchBox" placeholder="🔍 Search Projects..." onkeyup="window.filterProjects()">
</div>
<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Sr No</th>
<th>Project Name</th>
<th>Business</th>
<th>Owner</th>
<th>Running Task</th>
<th>Start Date</th>
<th>End Date</th>
<th>Status</th>
<th>Priority</th>
<th>Ageing</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<div class="note">Showing the ${allProjects.length} most recent record(s).</div>
`;

contentEl.innerHTML = html;

window.allProjects = allProjects;
window.filterProjects();

}catch(error){
console.error(error);
contentEl.innerHTML = "<h1>Unable to load projects</h1><p id='msg'>Check your connection or permissions.</p>";
}
}

window.filterProjects = function(){
const searchEl = document.getElementById("searchBox");
const search = searchEl ? searchEl.value.toLowerCase().trim() : "";
const tbody = document.getElementById("tableBody");
if(!tbody) return;

let html = "";
let sr = 1;

(window.allProjects || []).forEach((d)=>{
const txt = JSON.stringify(d).toLowerCase();
if(search && !txt.includes(search)) return;

let badgeClass = "badge-pending";
if(d.taskStatus === "In Progress") badgeClass = "badge-progress";
if(d.taskStatus === "Complete") badgeClass = "badge-complete";

html += `
<tr class="${isOverdue(d) ? 'overdue' : ''}">
<td>${sr++}</td>
<td><b>${escapeHtml(d.projectName)}</b></td>
<td>${escapeHtml(d.business)}</td>
<td>${escapeHtml(d.ownerName || d.projectOwner)}</td>
<td>${escapeHtml(d.runningTask)}</td>
<td>${escapeHtml(d.taskStartDate)}</td>
<td>${escapeHtml(d.taskEndDate)}</td>
<td><span class="badge-status ${badgeClass}">${escapeHtml(d.taskStatus)}</span></td>
<td>${escapeHtml(d.taskPriority)}</td>
<td>${ageing(d)}</td>
</tr>
`;
});

tbody.innerHTML = html || "<tr><td colspan='10' style='text-align:center;padding:16px;color:var(--muted);'>No projects found.</td></tr>";
};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(id){
renderSingle(id);
}else{
renderAll();
}

</script>

</body>
</html>
