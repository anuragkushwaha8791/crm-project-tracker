<style>
:root{
  --bg:#f8fafc;
  --card-bg:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --sidebar-bg:#0f172a;
  --sidebar-txt:#f8fafc;
  --sidebar-active:#1e293b;
  --sidebar-accent:#38bdf8;
  --navy:#1f4e79;
  --navy-dark:#163a5c;
  --red:#e2131f;
  --danger:#dc2626;
  --success:#16a34a;
  --warn:#d97706;
  --badge-pending-bg:#fef3c7;
  --badge-pending-txt:#92400e;
  --badge-progress-bg:#dbeafe;
  --badge-progress-txt:#1e40af;
  --badge-complete-bg:#dcfce7;
  --badge-complete-txt:#166534;
}

[data-theme="dark"]{
  --bg:#0f172a;
  --card-bg:#1e293b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#334155;
  --sidebar-bg:#090d16;
  --sidebar-txt:#f8fafc;
  --sidebar-active:#1e293b;
  --sidebar-accent:#38bdf8;
  --navy:#38bdf8;
  --navy-dark:#0284c7;
  --badge-pending-bg:#451a03;
  --badge-pending-txt:#fde68a;
  --badge-progress-bg:#172554;
  --badge-progress-txt:#bfdbfe;
  --badge-complete-bg:#052e16;
  --badge-complete-txt:#86efac;
}

*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }

body{ background:var(--bg); color:var(--text); transition:background .3s,color .3s; display:flex; min-height:100vh; }

/* ---------- Sidebar Navigation ---------- */
.sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99; }

.app-sidebar{
  width:260px;
  background:var(--sidebar-bg);
  color:var(--sidebar-txt);
  position:fixed;
  top:0; bottom:0; left:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  transition:transform .3s ease;
  border-right:1px solid rgba(255,255,255,0.08);
}

.sidebar-header{
  padding:24px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.brand-title{
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
  color:white;
  text-decoration:none;
}
.brand-title span{ color:var(--red); }

.brand-badge{
  font-size:10px;
  font-weight:800;
  background:var(--red);
  color:white;
  padding:2px 6px;
  border-radius:4px;
  text-transform:uppercase;
}

.sidebar-nav{
  padding:20px 12px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow-y:auto;
}

.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  color:#94a3b8;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  border-radius:8px;
  transition:all .2s ease;
  cursor:pointer;
  border:none;
  background:none;
  width:100%;
  text-align:left;
}

.nav-item:hover{
  background:rgba(255,255,255,0.06);
  color:white;
}

.nav-item.active{
  background:linear-gradient(90deg, var(--navy), #2563eb);
  color:white;
  box-shadow:0 4px 12px rgba(37,99,235,0.3);
}

.nav-item .icon{ font-size:18px; width:22px; text-align:center; }

.sidebar-footer{
  padding:16px;
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.user-profile-chip{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  background:rgba(255,255,255,0.04);
  border-radius:8px;
}

.avatar-circle{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:14px;
}

.user-info-text{ display:flex; flex-direction:column; overflow:hidden; }
.user-info-name{ font-size:13px; font-weight:700; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-info-role{ font-size:11px; color:#94a3b8; }

.theme-toggle-btn{
  background:rgba(255,255,255,0.08);
  color:white;
  border:none;
  padding:8px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background .2s;
}
.theme-toggle-btn:hover{ background:rgba(255,255,255,0.15); }

/* ---------- Main Content Container ---------- */
.app-main{
  flex:1;
  margin-left:260px;
  display:flex;
  flex-direction:column;
  min-width:0;
  transition:margin-left .3s ease;
}

.top-app-bar{
  background:var(--card-bg);
  border-bottom:1px solid var(--border);
  padding:16px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:90;
}

.mobile-hamburger{
  display:none;
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
  color:var(--text);
}

.page-header-title{
  font-size:20px;
  font-weight:800;
  color:var(--navy);
  display:flex;
  align-items:center;
  gap:10px;
}

.main-content{ padding:28px; flex:1; }

/* ---------- Grouped Form Card ---------- */
.form-card{
  background:var(--card-bg);
  padding:24px;
  border-radius:16px;
  margin-bottom:24px;
  box-shadow:0 4px 20px rgba(0,0,0,0.04);
  border:1px solid var(--border);
}

.form-card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
}

.form-card-title{
  font-size:16px;
  font-weight:800;
  color:var(--navy);
  display:flex;
  align-items:center;
  gap:8px;
}

.form-sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:20px;
}

.form-group-section{
  background:var(--bg);
  padding:16px;
  border-radius:12px;
  border:1px solid var(--border);
}

.form-section-label{
  font-size:12px;
  font-weight:800;
  color:var(--navy);
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:6px;
}

.form-field{
  margin-bottom:12px;
}
.form-field:last-child{ margin-bottom:0; }

.form-field label{
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.5px;
  display:block;
  margin-bottom:4px;
}

input, select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card-bg);
  color:var(--text);
  font-size:13px;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
input:focus, select:focus{
  border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(56,189,248,0.15);
}

.form-actions{
  margin-top:20px;
  display:flex;
  gap:12px;
  align-items:center;
}

button{
  background:var(--navy);
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:all .2s;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
button:hover{ background:var(--navy-dark); transform:translateY(-1px); }
button.secondary{ background:#64748b; }
button.secondary:hover{ background:#475569; }
button.share{ background:#16a34a; padding:6px 12px; font-size:12px; }
button.share:hover{ background:#15803d; }
button.actionBtn{ padding:6px 12px; font-size:12px; border-radius:6px; font-weight:700; }
button.editBtn{ background:var(--navy); }
button.deleteBtn{ background:var(--danger); }

/* ---------- Filter Bar ---------- */
.filter-bar{
  background:var(--card-bg);
  padding:16px 20px;
  border-radius:14px;
  border:1px solid var(--border);
  margin-bottom:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.03);
}

.search-box-wrap{
  flex:1;
  min-width:280px;
  position:relative;
}

.search-box-wrap input{
  padding-left:36px;
  margin:0;
}

.search-icon-inside{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:14px;
  pointer-events:none;
}

.filter-chips{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.chip-btn{
  background:var(--bg);
  color:var(--muted);
  border:1px solid var(--border);
  padding:6px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s;
}

.chip-btn:hover, .chip-btn.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}

#formStatus{
  font-size:13px;
  font-weight:700;
  color:var(--danger);
  min-height:18px;
}

.table-wrapper{
  overflow-x:auto;
  border-radius:14px;
  border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,0.04);
  background:var(--card-bg);
}

table{ width:100%; border-collapse:collapse; background:var(--card-bg); white-space:nowrap; }
th, td{ border-bottom:1px solid var(--border); padding:12px 16px; font-size:12px; text-align:left; vertical-align:top; }
.cell-name{ max-width:200px; min-width:140px; white-space:normal; word-break:break-word; line-height:1.4; }

th{
  background:var(--navy);
  color:white;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
  position:sticky;
  top:0;
  z-index:10;
}

.sticky-actions{
  position:sticky;
  right:0;
  background:var(--card-bg);
  z-index:5;
  box-shadow:-4px 0 10px rgba(0,0,0,0.06);
  text-align:center;
}
th.sticky-actions{
  background:var(--navy);
  color:white;
  z-index:15;
}
tr.overdue .sticky-actions{ background:#fef2f2; }
[data-theme="dark"] tr.overdue .sticky-actions{ background:#451a1a; }

.action-btn-group{ display:flex; align-items:center; justify-content:center; gap:6px; }
.icon-action-btn{
  background:var(--navy);
  color:white;
  border:none;
  width:32px;
  height:32px;
  border-radius:6px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  transition:all .2s;
  padding:0;
}
.icon-action-btn:hover{ transform:translateY(-1px); filter:brightness(1.15); box-shadow:0 2px 6px rgba(0,0,0,0.15); }
.icon-action-btn.delete-icon{ background:var(--danger); }

tr:hover{ background:rgba(0,0,0,0.02); }
[data-theme="dark"] tr:hover{ background:rgba(255,255,255,0.02); }
tr.overdue{ background:#fef2f2; }
[data-theme="dark"] tr.overdue{ background:#451a1a; }

.badge-status{ display:inline-block; padding:4px 10px; border-radius:12px; font-weight:700; font-size:11px; }
.badge-pending{ background:var(--badge-pending-bg); color:var(--badge-pending-txt); }
.badge-progress{ background:var(--badge-progress-bg); color:var(--badge-progress-txt); }
.badge-complete{ background:var(--badge-complete-bg); color:var(--badge-complete-txt); }

.badge-priority{ display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:700; }
.priority-High{ background:#fee2e2; color:#991b1b; }
.priority-Medium{ background:#fef3c7; color:#92400e; }
.priority-Low{ background:#e0f2fe; color:#075985; }

.loadMoreBtn{
  background:#64748b;
  color:white;
  border:none;
  padding:10px 24px;
  border-radius:8px;
  cursor:pointer;
  margin-top:20px;
  font-size:13px;
  font-weight:700;
}

.scale-note{ font-size:12px; color:var(--muted); margin-bottom:12px; }

.modalOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(3px);
  z-index:200;
  justify-content:center;
  align-items:center;
}
.modalOverlay.show{ display:flex; }

.modalBox{
  background:var(--card-bg);
  padding:28px;
  border-radius:14px;
  width:90%;
  max-width:440px;
  border:1px solid var(--border);
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
}
.modalBox h2{ color:var(--navy); margin-bottom:16px; font-size:18px; font-weight:800; }
.modalBox .closeBtn{ background:#64748b; color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; margin-top:12px; font-weight:700; }

@media (max-width:768px){
  .app-sidebar{ transform:translateX(-100%); }
  .app-sidebar.sidebar-open{ transform:translateX(0); }
  .sidebar-overlay.sidebar-open{ display:block; }
  .app-main{ margin-left:0; }
  .mobile-hamburger{ display:block; }
}

.pinned-row td{background:rgba(250,204,21,.10)}
.as-row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.as-row b{color:var(--text)}.as-row small{display:block;color:var(--muted);margin-top:3px}.as-row .od{color:var(--danger);font-weight:700}
.as-more{display:none;margin:14px auto 0;background:#64748b;color:#fff;border:none;padding:9px 20px;border-radius:8px;cursor:pointer;font-weight:700}
.as-box{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px}
.as-tabs{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.as-tab{background:var(--card-bg);color:var(--text);border:1px solid var(--border);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px}
.as-tab.on{background:linear-gradient(90deg,var(--navy),#2563eb);color:#fff;border-color:transparent}
</style>

<script>
(function(){
  const saved = localStorage.getItem("crm-theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  document.addEventListener("DOMContentLoaded", ()=>{
    const btnText = document.getElementById("themeToggleText");
    if(btnText) btnText.textContent = saved === "dark" ? "Light Theme" : "Dark Theme";
  });
})();

function toggleTheme(){
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("crm-theme", next);
  const btnText = document.getElementById("themeToggleText");
  if(btnText) btnText.textContent = next === "dark" ? "Light Theme" : "Dark Theme";
}

function toggleMobileSidebar(){
  const sidebar = document.getElementById("appSidebar");
  const overlay = document.getElementById("sidebarOverlay");
  if(sidebar) sidebar.classList.toggle("sidebar-open");
  if(overlay) overlay.classList.toggle("sidebar-open");
}

function toggleFormCard(){
  const formCard = document.getElementById("projectFormCard");
  if(formCard){
    const isHidden = formCard.style.display === "none" || !formCard.style.display;
    formCard.style.display = isHidden ? "block" : "none";
    if(isHidden){
      window.scrollTo({ top:0, behavior:'smooth' });
    }
  }
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updatePassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, updateDoc, query, where, orderBy, limit, startAfter, serverTimestamp, onSnapshot, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = window.CRM_FIREBASE();
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id)=>document.getElementById(id);
let currentUser = null, currentName = "", currentRole = "", userDoc = {};

function escapeHtml(v){ if(v === undefined || v === null) return ""; return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
function fmtTs(t){ try{ const d = t && t.toDate ? t.toDate() : null; return d ? d.toLocaleString([], {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"}) : "-"; }catch(e){ return "-"; } }
async function logActivity(action, details){
try{ await addDoc(collection(db,"activityLogs"), { action, details: details || "", userEmail: currentUser ? currentUser.email : "", userName: currentName, timestamp: serverTimestamp(), expireAt: CRM.expireAt() }); CRM.bump(action); }catch(e){ console.error(e); }
}
window.logout = async function(){
CRM.clearUserCache();
await logActivity("Logout", "");
signOut(auth).then(()=>{ window.location.href = "index.html"; });
};

let tab = "me", forceNext = false;
const data = { me: { rows: [], shown: 5, loaded: false }, by: { rows: [], shown: 5, loaded: false } };
const ms = (t)=> (t && t.toMillis ? t.toMillis() : 0);

async function loadTab(which){
const t = data[which];
const ck = "asn." + which;
let rows = !forceNext ? CRM.cache.get(ck, 180000) : null;
if(!rows){
const q = which === "me" ? query(collection(db,"crmprojects"), where("ownerUid","==",currentUser.uid), limit(100)) : query(collection(db,"crmprojects"), where("assignedByUid","==",currentUser.uid), limit(100));
const snap = await getDocs(q);
rows = [];
snap.forEach(d=>{ const x = d.data(); if(which === "me" && (!x.assignedByUid || x.assignedByUid === currentUser.uid)) return; rows.push({ id: d.id, d: { projectName: x.projectName, runningTask: x.runningTask, ownerName: x.ownerName, assignedByName: x.assignedByName, taskStatus: x.taskStatus, taskPriority: x.taskPriority, taskStartDate: x.taskStartDate, taskEndDate: x.taskEndDate, createdAt: x.createdAt } }); });
rows.sort((a,b)=>ms(b.d.createdAt) - ms(a.d.createdAt));
CRM.cache.set(ck, rows);
}
t.rows = rows; t.shown = 5; t.loaded = true;
}
function overdue(d){ return d.taskEndDate && d.taskStatus !== "Complete" && d.taskEndDate < CRM.todayStr(); }
function draw(){
const t = data[tab];
$("tabMe").classList.toggle("on", tab === "me"); $("tabBy").classList.toggle("on", tab === "by");
const show = t.rows.slice(0, t.shown);
$("asList").innerHTML = show.length ? show.map(({d})=>`<div class="as-row"><div><b>${escapeHtml(d.projectName)}</b><small>${tab === "me" ? "Assigned by " + escapeHtml(d.assignedByName || "an Admin") : "Assigned to " + escapeHtml(d.ownerName || "")}${d.runningTask ? " · " + escapeHtml(d.runningTask) : ""}</small></div><div style="text-align:right;white-space:nowrap">${escapeHtml(d.taskStatus || "")}<small class="${overdue(d) ? "od" : ""}">${escapeHtml(d.taskPriority || "")}${d.taskEndDate ? " · due " + escapeHtml(d.taskEndDate) : ""}</small></div></div>`).join("")
: `<div style="color:var(--muted)">${tab === "me" ? "Nobody has assigned you a task yet." : "You have not assigned any task yet."}</div>`;
const left = t.rows.length - t.shown;
$("asMore").style.display = left > 0 ? "inline-block" : "none"; $("asMore").textContent = "Show more (" + left + ")";
$("asDownload").style.display = CRM.can("export") ? "inline-block" : "none";
}
async function show(which){ tab = which; try{ if(!data[which].loaded) await loadTab(which); }catch(e){ console.error(e); $("asList").innerHTML = `<div style="color:var(--danger)">Could not load (${escapeHtml(e.code || e.message)}).</div>`; return; } draw(); }
$("tabMe").onclick = ()=>show("me"); $("tabBy").onclick = ()=>show("by");
$("asMore").onclick = ()=>{ data[tab].shown += 5; draw(); };
$("asDownload").onclick = ()=>{
if(!CRM.can("export")){ alert("Downloading data is not enabled for your account."); return; }
const q = (v)=>'"' + String(v === undefined || v === null ? "" : v).replace(/"/g, '""') + '"';
const csv = ["Project,Person,Status,Priority,Start,End"].concat(data[tab].rows.map(({d})=>[d.projectName, tab === "me" ? d.assignedByName : d.ownerName, d.taskStatus, d.taskPriority, d.taskStartDate, d.taskEndDate].map(q).join(","))).join("\n");
const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "assigned-tasks.csv"; a.click(); URL.revokeObjectURL(a.href);
};
const refreshAll = CRM.makeRefresher(async (force)=>{ forceNext = force !== false; data.me.loaded = data.by.loaded = false; await show(tab); forceNext = false; });
window.manualRefresh = refreshAll;

onAuthStateChanged(auth, async (user)=>{
if(!user){ window.location.href = "index.html"; return; }
try{
currentUser = user;
const snap = await getDoc(doc(db,"users",user.uid));
userDoc = snap.exists() ? snap.data() : {};
if(userDoc.disabled === true || userDoc.deleted === true){ window.location.href = "index.html"; return; }
currentRole = userDoc.role || "User";
currentName = userDoc.name || user.email;
$("userNameLabel").textContent = currentName;
$("userRoleBadge").textContent = currentRole;
$("userAvatar").textContent = (currentName || "U").charAt(0).toUpperCase();
CRM.setUser(currentName, currentRole, userDoc.gender);
await CRM.loadAccess();
CRM.initColumns({
isAdmin: CRM.can("columns"),
load: async ()=>{ const sn = await getDoc(doc(db,"settings","columns")); return sn.exists() ? (sn.data().labels || {}) : {}; },
save: async (map)=>{ await setDoc(doc(db,"settings","columns"), { labels: map, updatedBy: currentUser.uid, updatedAt: serverTimestamp() }); }
});
if(CRM.can("assign")) $("tabBy").style.display = "inline-block";
CRM.setContextProvider(()=>"Assigned tasks page (" + tab + "): " + data[tab].rows.map(r=>r.d.projectName + " [" + r.d.taskStatus + "]").join("; "));
await show("me");
CRM.markRefreshed();
CRM.startAutoRefresh(refreshAll);
CRM.setBump(()=>setDoc(doc(db,"meta","live"), { ts: serverTimestamp(), by: currentUser.uid }));
CRM.startLive((cb)=>onSnapshot(doc(db,"meta","live"), (s)=>cb(s.exists() ? (s.data().by || null) : null), ()=>{}), refreshAll, currentUser.uid);
}catch(error){ console.error("Init error:", error); }
});
</script>

</body>
</html>
